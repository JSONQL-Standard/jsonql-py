[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonql-py"
version = "1.1.0"
description = "Python SDK for JSONQL — a JSON-based query language for SQL databases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "JSONQL Standard" },
]
keywords = ["jsonql", "sql", "query", "api", "orm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/JSONQL-Standard/jsonql-py"
Documentation = "https://jsonql.org"
Repository = "https://github.com/JSONQL-Standard/jsonql-py"
Issues = "https://github.com/JSONQL-Standard/jsonql-py/issues"
Changelog = "https://github.com/JSONQL-Standard/jsonql-py/blob/master/CHANGELOG.md"

[project.optional-dependencies]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.100", "uvicorn>=0.20"]
django = ["django>=4.0", "djangorestframework>=3.14"]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["mysql-connector-python>=8.0"]
sqlite = []
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jsonql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pymongo.*",
    "psycopg2.*",
    "pymysql.*",
    "pymssql.*",
    "flask.*",
    "fastapi.*",
    "starlette.*",
    "django.*",
    "uvicorn.*",
]
ignore_missing_imports = true
follow_imports = "skip"
